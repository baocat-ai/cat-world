<script>
"use strict";
// ===================== THE ENGINE (the same in every game the cat makes) =====================
// The cat's words are in the "cat-data" block and the numbers in "game-config". Words are only
// ever shown with textContent or fillText, so a word can never turn into code.
const D = JSON.parse(document.getElementById("cat-data").textContent);
const C = JSON.parse(document.getElementById("game-config").textContent);
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height, K = C.colours, TAU = Math.PI * 2;
document.getElementById("title").textContent = D.title;
document.getElementById("how").textContent = D.how;
canvas.setAttribute("aria-label", D.title + ". " + D.how);

// Seeded dice: the game plays the same way every time it loads (like the cat's own dice).
let seed = (C.seed >>> 0) || 1;
function rnd() {
  seed = (seed + 0x6D2B79F5) >>> 0;
  let t = seed;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
function has(name) { return C.parts.indexOf(name) >= 0; }
function bug(name) { return C.bugs.indexOf(name) >= 0; }

const G = { mode: "play", score: 0, level: 1, time: 0, left: 0, lives: 0, msg: "", note: "", noteT: 0,
            keys: {}, mouse: { x: W / 2, y: H / 2, down: false } };
const PARTS = [];
function addPart(p) { PARTS.push(p); }
function run(hook, a, b) { for (const p of PARTS) { if (p[hook]) { p[hook](a, b); } } }

// Hooks that parts switch on. Until a part replaces them, they do nothing.
let sfx = function (name) {};
let burst = function (x, y, colour) {};
let gravity = 0;
let useSprites = false;
const SPRITES = {};

function say(text, seconds) { G.note = text; G.noteT = seconds || 1.5; }
function target() { return C.target + C.target_step * (G.level - 1); }
function startGame() {
  G.score = 0; G.level = 1; G.time = 0; G.left = C.seconds; G.lives = C.lives; G.msg = ""; G.noteT = 0;
  G.mode = "play";
  run("start");
}
function win() { if (G.mode !== "play") { return; } G.mode = "won"; G.msg = D.ui.win; sfx("win"); burst(W / 2, H / 2, K.accent); }

function goal() {   // reached the target: on to the next level, or the end

  else { win(); }
}
function addScore(n, x, y) {
  G.score += n;
  if (n > 0) { sfx("point"); burst(x, y, K.accent); }
  if (C.target > 0 && G.score >= target()) { goal(); }
}
function ouch(x, y) {   // touched something bad
  sfx("hit"); burst(x, y, K.bad);
  if (has("lives")) { G.lives -= 1; if (G.lives <= 0) { lose(); } else { say(D.ui.ouch, 1); } }
  else { lose(); }
}

// ----- Input: mouse, finger and keyboard -----
function toCanvas(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
canvas.addEventListener("pointerdown", function (e) {
  const p = toCanvas(e);
  G.mouse.x = p.x; G.mouse.y = p.y; G.mouse.down = true;
  if (G.mode === "menu") { startGame(); return; }
  if (G.mode !== "play") { if (!bug("no_restart")) { startGame(); } return; }
  run("press", p.x, p.y);
});
canvas.addEventListener("pointermove", function (e) { const p = toCanvas(e); G.mouse.x = p.x; G.mouse.y = p.y; });
window.addEventListener("pointerup", function (e) {
  if (!G.mouse.down) { return; }
  G.mouse.down = false;
  const p = toCanvas(e);
  if (G.mode === "play") { run("release", p.x, p.y); }
});
const GAME_KEYS = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "];
function pressKey(k) {
  if (G.mode === "menu") { if (k === "Enter" || k === " ") { startGame(); } return; }
  if (G.mode !== "play") { if ((k === "Enter" || k === "r" || k === "R") && !bug("no_restart")) { startGame(); } return; }
  run("key", k);
}
window.addEventListener("keydown", function (e) {
  if (GAME_KEYS.indexOf(e.key) >= 0) { e.preventDefault(); }
  G.keys[e.key] = true;
  if (!e.repeat) { pressKey(e.key); }
});
window.addEventListener("keyup", function (e) { G.keys[e.key] = false; });

// ----- A tiny picture library: every picture is made of circles and polygons -----
function circle(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, Math.max(0.5, r), 0, TAU); ctx.fill(); }

  ctx.closePath(); ctx.fill();
}
function box(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function stroke(c, wide, pts) {

function words(text, x, y, size, c, align) {

}

  ctx.font = "bold " + size + "px system-ui, sans-serif";
  const parts = String(text).split(" ");
  let lineText = "", yy = y;
  for (const w of parts) {
    const test = lineText ? lineText + " " + w : w;
    if (ctx.measureText(test).width > width && lineText) { words(lineText, x, yy, size, c); lineText = w; yy += size * 1.3; }
    else { lineText = test; }
  }
  if (lineText) { words(lineText, x, yy, size, c); }

}

  const r = Math.round(((n >> 16) & 255) * k), g = Math.round(((n >> 8) & 255) * k), b = Math.round((n & 255) * k);

    if (fine) { eye(x - s * 0.32, y - s * 0.1, s * 0.2); eye(x + s * 0.32, y - s * 0.1, s * 0.2); circle(x, y + s * 0.2, s * 0.1, "#f28cb1"); }

    circle(x - s * 0.55, y + s * 0.5, s * 0.3, "#333333"); circle(x + s * 0.55, y + s * 0.5, s * 0.3, "#333333");
    if (fine) { box(x + s * 0.35, y - s * 0.8, s * 0.5, s * 0.4, "#cfefff"); }
  },
  ticket: function (x, y, s, c) { box(x - s, y - s * 0.6, s * 2, s * 1.2, c); if (fine) { box(x - s * 0.6, y - s * 0.1, s * 1.2, s * 0.2, "#333333"); } },
  rock: function (x, y, s, c) {
    poly(c, [x - s, y + s * 0.3, x - s * 0.6, y - s * 0.7, x + s * 0.2, y - s, x + s, y - s * 0.2, x + s * 0.7, y + s * 0.8, x - s * 0.4, y + s * 0.9]);
    if (fine) { circle(x - s * 0.2, y - s * 0.3, s * 0.18, darker(c, 0.75)); }
  },
  gem: function (x, y, s, c) { poly(c, [x, y - s, x + s * 0.8, y - s * 0.2, x, y + s, x - s * 0.8, y - s * 0.2]); if (fine) { poly("#ffffff", [x - s * 0.2, y - s * 0.6, x, y - s * 0.8, x - s * 0.05, y - s * 0.3]); } },
  volcano: function (x, y, s, c) { poly("#6b4a3a", [x - s * 1.2, y + s, x - s * 0.3, y - s * 0.6, x + s * 0.3, y - s * 0.6, x + s * 1.2, y + s]); oval(x, y - s * 0.6, s * 0.35, s * 0.15, c); },

  },
  rocket: function (x, y, s, c) {
    oval(x, y, s * 0.45, s, c); poly("#d94a4a", [x - s * 0.4, y - s * 0.6, x, y - s * 1.3, x + s * 0.4, y - s * 0.6]);
    poly("#d94a4a", [x - s * 0.45, y + s * 0.3, x - s * 0.9, y + s, x - s * 0.3, y + s * 0.8]);
    poly("#d94a4a", [x + s * 0.45, y + s * 0.3, x + s * 0.9, y + s, x + s * 0.3, y + s * 0.8]);
    if (fine) { circle(x, y - s * 0.2, s * 0.22, "#9fd3f2"); }

  star: function (x, y, s, c) {
    const pts = [];

  flower: function (x, y, s, c) { for (let i = 0; i < 5; i++) { const a = i * TAU / 5; circle(x + Math.cos(a) * s * 0.55, y + Math.sin(a) * s * 0.55, s * 0.45, c); } circle(x, y, s * 0.35, "#f2c94c"); },
  beetle: function (x, y, s, c) { circle(x, y - s * 0.75, s * 0.35, "#2b2b2b"); circle(x, y, s * 0.8, c); if (fine) { circle(x - s * 0.3, y, s * 0.15, "#2b2b2b"); circle(x + s * 0.3, y + s * 0.2, s * 0.15, "#2b2b2b"); } },
  mouse: function (x, y, s, c) { oval(x, y, s, s * 0.6, c); circle(x + s * 0.6, y - s * 0.5, s * 0.3, c); stroke(c, 2, [x - s, y, x - s * 1.5, y - s * 0.3]); if (fine) { eye(x + s * 0.65, y - s * 0.1, s * 0.12); } },
  drop: function (x, y, s, c) { circle(x, y + s * 0.25, s * 0.65, c); poly(c, [x - s * 0.6, y + s * 0.1, x, y - s, x + s * 0.6, y + s * 0.1]); },
  cheese: function (x, y, s, c) { poly(c, [x - s, y + s * 0.6, x + s, y + s * 0.6, x + s, y - s * 0.6]); if (fine) { circle(x + s * 0.4, y + s * 0.2, s * 0.15, darker(c, 0.8)); } },
  sun: function (x, y, s, c) { for (let i = 0; i < 8; i++) { const a = i * TAU / 8; stroke(c, 3, [x + Math.cos(a) * s * 0.7, y + Math.sin(a) * s * 0.7, x + Math.cos(a) * s * 1.1, y + Math.sin(a) * s * 1.1]); } circle(x, y, s * 0.6, c); },
  cloud: function (x, y, s, c) { circle(x - s * 0.5, y, s * 0.5, c); circle(x + s * 0.5, y, s * 0.5, c); circle(x, y - s * 0.3, s * 0.6, c); },
  shell: function (x, y, s, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y + s * 0.4, s, Math.PI, 0); ctx.closePath(); ctx.fill(); if (fine) { for (let i = 1; i < 4; i++) { stroke(darker(c, 0.8), 1, [x, y + s * 0.4, x - s + i * s * 0.5, y - s * 0.5]); } } },
  crab: function (x, y, s, c) { oval(x, y, s, s * 0.6, c); circle(x - s, y - s * 0.6, s * 0.35, c); circle(x + s, y - s * 0.6, s * 0.35, c); if (fine) { eye(x - s * 0.3, y - s * 0.5, s * 0.15); eye(x + s * 0.3, y - s * 0.5, s * 0.15); } },
  pumpkin: function (x, y, s, c) {

    box(x - s * 0.1, y - s * 1.1, s * 0.2, s * 0.35, "#4caf50");

function drawThing(name, x, y, s, c) {

    for (let k = 0; k < rows[r].length; k++) {
      const v = rows[r][k];
      if (v !== "0") { box(Math.round(x - s + k * px), Math.round(y - s + r * px), Math.ceil(px), Math.ceil(px), v === "2" ? "#222222" : c); }

// ----- Scenery behind the game (better builders paint a background) -----
const DECOR = [];

const SCENERY = {
  none: function () {},
  night: function () { circle(W - 60, 60, 26, "#f4f1ea"); for (const d of DECOR) { if (d[1] < H * 0.6) { circle(d[0], d[1], 1 + d[2], "#f4f1ea"); } } },
  space: function () { for (const d of DECOR) { circle(d[0], d[1], 0.5 + d[2] * 1.5, "#ffffff"); } },
  sky: function () { for (let i = 0; i < 4; i++) { GLYPHS.cloud(DECOR[i][0], 40 + DECOR[i][2] * 60, 22, "rgba(255,255,255,0.7)"); } },
  hills: function () { oval(W * 0.25, H + 40, W * 0.45, 120, K.ground); oval(W * 0.8, H + 60, W * 0.4, 130, darker(K.ground, 0.9)); },
  garden: function () { box(0, H - 30, W, 30, K.ground); for (let i = 0; i < 8; i++) { GLYPHS.flower(DECOR[i][0], H - 12, 6, DECOR[i][2] > 0.5 ? "#f28cb1" : "#ffffff"); } },
  sea: function () { for (let i = 0; i < 6; i++) { const x = DECOR[i][0]; stroke("#2f7a4a", 4, [x, H, x + Math.sin(G.time + i) * 8, H - 30, x, H - 60]); } box(0, H - 14, W, 14, "#e9d29a"); },
  beach: function () { box(0, H - 40, W, 40, "#e9d29a"); box(0, H - 52, W, 12, "#4fb3d9"); circle(60, 60, 26, "#f2c94c"); },
  room: function () { box(0, H - 40, W, 40, K.ground); box(30, 60, 70, 50, "#cfefff"); },
  volcano: function () {
    poly("#6b4a3a", [W / 2 - 150, H, W / 2 - 30, 70, W / 2 + 30, 70, W / 2 + 150, H]);
    oval(W / 2, 70, 30, 9, "#f08c2e");
    if (C.detail >= 0.5) { ctx.globalAlpha = 0.25 + 0.15 * Math.sin(G.time * 3); circle(W / 2, 60, 40, "#f2c94c"); ctx.globalAlpha = 1; }
  }
};
function background() {
  if (C.detail >= 0.35) {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, K.bg); g.addColorStop(1, K.bg2); ctx.fillStyle = g;
  } else { ctx.fillStyle = K.bg; }
  ctx.fillRect(0, 0, W, H);
  (SCENERY[C.scenery] || SCENERY.none)();
}

// ----- The game loop: update everything a little, then draw it all, about 60 times a second -----
let last = 0;
function paint() {
  background();
  run("draw");
  run("hud");
  if (G.noteT > 0 && G.note) { words(G.note, W / 2, 56, 20, K.text); }
  if (D.signature) { words(D.signature, W - 8, 42, 11, K.text, "right"); }
  if (G.mode === "won" || G.mode === "over") {
    ctx.globalAlpha = 0.8; box(0, H / 2 - 50, W, 100, K.panel); ctx.globalAlpha = 1;
    words(G.msg, W / 2, H / 2 - 4, 28, K.text);
    if (!bug("no_restart")) { words(D.ui.again, W / 2, H / 2 + 30, 15, K.text); }
  }
  run("overlay");
}
function frame(t) {
  const dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
  last = t;
  if (G.mode === "play") { G.time += dt; if (G.noteT > 0) { G.noteT -= dt; } run("update", dt); }
  run("tick", dt);
  paint();
  requestAnimationFrame(frame);
}

// GAME: click toy - click the thing and it does something funny.
const T = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: C.size, wiggle: 0, pop: "", popT: 0, px: 0, py: 0 };
function aim() { const a = rnd() * TAU; T.vx = Math.cos(a); T.vy = Math.sin(a); }
addPart({
  start: function () { T.x = W / 2; T.y = H / 2; T.r = C.size; aim(); },
  levelup: function () { T.r = Math.max(14, T.r * 0.85); aim(); },
  update: function (dt) {
    const speed = C.speed * (1 + 0.3 * (G.level - 1));
    if (rnd() < dt * 0.7) { aim(); }
    T.x += T.vx * speed * dt; T.y += T.vy * speed * dt;
    const edge = bug("offscreen") ? -T.r * 0.6 : T.r;
    if (T.x < edge || T.x > W - edge) { T.vx = -T.vx; T.x = clamp(T.x, edge, W - edge); }
    if (T.y < edge + 30 || T.y > H - edge) { T.vy = -T.vy; T.y = clamp(T.y, edge + 30, H - edge); }
    T.wiggle = Math.max(0, T.wiggle - dt); T.popT = Math.max(0, T.popT - dt);
  },
  press: function (x, y) {
    if (dist(x, y, T.x, T.y) > reach(T.r * 1.15)) { return; }
    T.wiggle = 0.4; T.pop = pick(D.pops); T.popT = 0.9; T.px = T.x; T.py = T.y - T.r - 10;
    if (has("score")) { addScore(1, T.x, T.y); } else { sfx("point"); burst(T.x, T.y, K.accent); }
    aim();
  },
  draw: function () {
    drawThing(C.things.target, T.x + Math.sin(T.wiggle * 40) * T.wiggle * 20, T.y, T.r, K.item);
    if (T.popT > 0) { words(T.pop, T.px, T.py - (0.9 - T.popT) * 30, 20, K.text); }
  }
});

// ----- Off we go! -----
startGame();
if (has("menu")) { G.mode = "menu"; }
requestAnimationFrame(frame);
</script>
